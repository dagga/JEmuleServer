# JEmuleServer Configuration
# Port to listen on (default: 4661)
port=4661

# Max packet size in bytes (default: 2097152)
maxPacketSize=2097152

# Max search results returned (default: 300)
maxSearchResults=300

# Flood protection: max requests per second per IP (default: 50)
floodMaxRequestsPerSecond=50

# Max concurrent users (default: 1000000): further logins are refused with a "server full" message
maxUsers=1000000

# Max global files (default: 10000000)
maxFiles=10000000

# Max files per user (default: 5000)
maxFilesPerUser=5000

# Max sources per file request (default: 200)
maxSourcesPerFile=200

# Database path (default: ./jemule_db)
databasePath=./jemule_db

# IP Filter path (e.g., ipfilter.dat)
# ipFilterPath=ipfilter.dat

# Fake file detection (default: true)
fakeFileDetectionEnabled=true

# Child abuse filter keywords (default: the list embedded in the jar)
# Files whose name advertises child sexual abuse material are refused and their hash banned; this filter cannot
# be disabled. Copy src/main/resources/child-abuse-keywords.properties to change the list: your file replaces it.
# childAbuseKeywordsPath=child-abuse-keywords.properties

# Admin console on a local TCP port (default: 0 = disabled)
# For a server running as a service, without a terminal: "nc 127.0.0.1 4670". Bound to 127.0.0.1 only, without
# authentication: anyone with a shell on the machine can use it.
# adminPort=4670

# Circuit Breaker: Failure rate threshold percentage (default: 50.0)
cbFailureRateThreshold=50.0

# Circuit Breaker: Min calls before calculating rate (default: 10)
cbMinimumNumberOfCalls=10

# Circuit Breaker: Wait duration in seconds (default: 60)
cbWaitDurationInSeconds=60

# TCP Keep-Alive Timeout in seconds (default: 1800)
# This controls how long the server waits for a client to send data before disconnecting.
tcpKeepAliveTimeoutInSeconds=1800

# Heartbeat Interval in seconds (default: 120)
# The server will send a SERVER_STATUS packet to the client every X seconds to check if it's still alive.
# Set to 0 to disable.
heartbeatIntervalSeconds=120

# HighID test (default: 5)
# At login the server connects to the client's TCP port and waits for its OP_HELLOANSWER for this many seconds.
# Clients that cannot be reached get a LowID. Set to 0 to disable the test (every client gets a LowID).
lowIdCheckTimeoutSeconds=5

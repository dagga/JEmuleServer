# JEmuleServer Configuration
# Port to listen on (default: 4661)
port=4661

# Max packet size in bytes (default: 2097152)
maxPacketSize=2097152

# Max search results returned (default: 300)
maxSearchResults=300

# Flood protection: max requests per second per IP (default: 50)
floodMaxRequestsPerSecond=50

# Max concurrent users (default: 1000000): further logins are refused with a "server full" message
maxUsers=1000000

# Max global files (default: 2000000): beyond it, new files are refused (known files still get new sources), from
# clients, Kad and other servers alike. New files are also refused while the live heap fills 80% of the old generation.
maxFiles=2000000

# Distinct files indexed per client, advertised as ST_SOFTFILES; re-offers of files it already shares do not count (default: 5000)
maxFilesPerUser=5000

# Max sources per file request (default: 200)
maxSourcesPerFile=200

# Database path (default: ./jemule_db): the H2 database, or with databaseType=mysql the H2 database of an older
# version imported into MySQL at the first start
databasePath=./jemule_db

# Database type (default: h2): h2 keeps everything in the file at databasePath; mysql uses a MySQL 8 server (or
# MariaDB), local or remote. Applied at the next start.
# databaseType=mysql
# databaseUrl=jdbc:mysql://127.0.0.1:3306/jemule
# databaseUser=jemule
# The password can be left empty here and given in the JEMULE_DATABASE_PASSWORD environment variable instead.
# databasePassword=
# With mysql, copy the H2 database at databasePath into the MySQL database at the first start, when that database
# holds no file yet (default: true). An interrupted import resumes at the next start; the H2 file is kept.
# databaseImportFromH2=true

# IP Filter file (default: ./ipfilter.dat)
# It is refreshed immediately at startup and daily from https://upd.emule-security.org/ipfilter.zip.
# ZIP archives are supported. Updates with a difference of 10% or more are rejected; the current file is
# kept and the rejection is recorded in ipfilter.dat.trace. Set to an empty value to disable automatic updates.
ipFilterPath=./ipfilter.dat

# Fake file detection (default: true)
fakeFileDetectionEnabled=true

# Child abuse filter keywords (default: the list embedded in the jar)
# Files whose name advertises child sexual abuse material are refused and their hash banned; this filter cannot
# be disabled. Copy src/main/resources/child-abuse-keywords.properties to change the list: your file replaces it.
# childAbuseKeywordsPath=child-abuse-keywords.properties

# Admin console on a TCP port (default: 0 = disabled)
# For a server running as a service, without a terminal: "nc <host> 4670".
# adminPort=4670

# Built-in web admin panel on HTTP port (default: 8080; set to 0 to disable).
adminWebPort=8080

# Administration bind address (default: 0.0.0.0; set to 127.0.0.1 to bind only on loopback).
# adminBindAddress=0.0.0.0

# Administration allowed IP addresses / CIDR blocks (comma-separated, default: 127.0.0.1,::1).
# Example: adminAllowedIps=127.0.0.1,192.168.1.0/24,10.0.0.50
# adminAllowedIps=127.0.0.1,::1

# Administration allowed MAC addresses for layer-2 / local network filtering (comma-separated, optional).
# If specified, connecting clients must match one of these MAC addresses in the local ARP table / interfaces.
# Example: adminAllowedMacs=00:1A:2B:3C:4D:5E,AA-BB-CC-DD-EE-FF
# adminAllowedMacs=

# Circuit Breaker: Failure rate threshold percentage (default: 50.0)
cbFailureRateThreshold=50.0

# Circuit Breaker: Min calls before calculating rate (default: 10)
cbMinimumNumberOfCalls=10

# Circuit Breaker: Wait duration in seconds (default: 60)
cbWaitDurationInSeconds=60

# TCP Keep-Alive Timeout in seconds (default: 1800)
# This controls how long the server waits for a client to send data before disconnecting.
tcpKeepAliveTimeoutInSeconds=1800

# Heartbeat Interval in seconds (default: 120)
# The server will send a SERVER_STATUS packet to the client every X seconds to check if it's still alive.
# Set to 0 to disable.
heartbeatIntervalSeconds=120

# HighID test (default: 5)
# At login the server connects to the client's TCP port and waits for its OP_HELLOANSWER for this many seconds.
# Clients that cannot be reached get a LowID. Set to 0 to disable the test (every client gets a LowID).
lowIdCheckTimeoutSeconds=5

# Comma-separated IPv4 eD2K server seed addresses (host:TCP-port); peers are added only after UDP status and
# server-description verification. Verified peers exchange server lists over the standard UDP server-list opcodes.
# Client-reported server lists are also accepted as candidates when explicitly sent; only verified peers are searched.
# Servers identified as MLDonkey or returning malformed/junk metadata are excluded.
# serverPeers=server.example.net:4661,192.0.2.10:4661

# Relay server (host:TCP-port, default: empty): once the index is full, the clients stay connected and learn this
# server at login; their searches and source requests, and the UDP global searches of other servers' clients, are
# played there and its answers return to them. Applied at once.
# relayServer=server.example.net:4661

# HTTPS eD2K server.met downloaded at startup. Its entries are merged with serverPeers and already discovered
# candidates; it never replaces or clears them. Set to an empty value to disable the download.
serverMetUrl=https://upd.emule-security.org/server.met

# ===================================================================
# Kademlia Client & Search Forking Configuration (Version 1.2)
# ===================================================================

# Enable embedded Kademlia client (default: true)
kadEnabled=true

# UDP port for Kad2 protocol (default: 0 = TCP port + 11, i.e. 4672 with the default port 4661)
# kadPort=4672

# Enable automated bootstrapping via connected HighID clients (default: true)
kadBootstrapFromClients=true

# Maximum contacts in routing table (default: 500)
kadMaxRoutingContacts=500

# Enable automated search forking to Kad (default: true)
kadForkSearchEnabled=true

# Maximum Kad search timeout in seconds (default: 4)
kadSearchTimeoutSeconds=4

# Ingest discovered Kad files into H2 database (default: true)
kadAutoIngestToH2=true

# Minimum sources required to deliver and persist a Kad file (default: 1)
kadMinSourcesForIngest=1

# nodes.dat sources used to seed the Kad routing table at startup, then refreshed daily like the IP filter.
# Comma-separated HTTP(S) URLs; each source is tried in order and the last successful list is cached next to the
# database (<databasePath>.nodes.dat) as a fallback. Leave empty to disable the download.
# The historical http://upd.emule-security.org/nodes path answers 404, hence the .dat suffix.
kadNodesUrls=https://upd.emule-security.org/nodes.dat,http://www.alldivx.de/nodes/nodes.dat

# Also search on Kad, in the background, the UDP global searches (OP_GLOBSEARCHREQ) that clients of other servers
# send to this server, to populate the database (default: true). They are answered from the local index as before;
# they are never forwarded to other eD2K servers, which could send them back.
kadForkGlobalSearches=true

# Kad sources: when a client asks for the sources of a file (OP_GETSOURCES) and the server knows fewer than
# kadSourceSearchMinLocal, search Kad and the verified eD2K servers for them and send the usable ones in a second
# OP_FOUNDSOURCES (default: false).
# Firewalled Kad sources are sent only when they are connected to this server, with their ID here (LowID included).
kadSourceSearchEnabled=false
# Below this number of local sources, Kad is asked (default: 10)
kadSourceSearchMinLocal=10
# New source searches per minute for all clients at most (default: 60): the quota is halved when Kad refuses requests
# and climbs back after ten minutes without refusal
kadSourceSearchesPerMinute=60

# Index update from the eD2K index peers (the verified eD2K servers): the server logs in to each of them as a client and searches there the
# words of its index and the keywords of its clients' searches (without their filters), then indexes the files found
# (default: false). Kad is not searched this way.
serverIndexUpdateEnabled=false
# Searches per server and per hour at most (default: 40)
serverIndexUpdateMaxPerHour=40
# Searches per server and per day at most (default: 300)
serverIndexUpdateMaxPerDay=300
# Sources a file found this way needs to be indexed (default: 3)
serverIndexUpdateMinSources=3

# OFFERFILES v1 (doc/offerfiles-v1.md): clients that ask for it at login (aMule 3.2 experimental option, eMule BB) are
# told in OP_SERVERIDENT how many files they may publish per OP_OFFERFILES and how often, and held to it (default:
# false). Clients that do not ask are never affected. The terms given at login apply to the whole connection.
offerFilesV1Enabled=false
# Most files a v1 client may offer in one OP_OFFERFILES; a larger batch is not indexed (default: 200)
offerFilesBatchMax=200
# Least time in milliseconds between two full batches of a v1 client; an early batch waits (default: 500)
offerFilesMinIntervalMs=500
# Files per second accepted from all v1 clients together, so that a reconnect wave slows down instead of saturating
# the server; 0 = no ceiling (default: 5000)
offerFilesGlobalRecordsPerSec=5000

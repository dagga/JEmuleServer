# JEmuleServer - keywords of file names advertising child sexual abuse material.
#
# A published file whose name matches is never indexed and its hash is banned for good (table banned_hashes).
# Files already in the database are checked at every startup: matching files are deleted and banned.
# This filter cannot be disabled. To use your own list, copy this file and set childAbuseKeywordsPath in
# server.properties; an unreadable file falls back to this embedded list.
#
# A name matches if it contains:
#   - a "banned" term, or
#   - a "minor" term or an age (a number up to maxMinorAge followed by an "ageSuffixes" term: "6yo", "12 y.o.",
#     "9 ans"), together with a "sexual" term.
#
# Syntax: comma-separated terms, case-insensitive. Names are split into words on every character other than a
# letter, a digit or '@'. A term matches whole words only ("kid" matches "Kid.avi" but not "kidnap").
# '*' stands for any letters or digits ("pedophil*" matches "pedophile" and "pedophilia", "*porn*" matches
# "kidporn"). A term with a space matches consecutive words ("child porn" matches "Child.Porn" and "child_porn").
# Use a backslash at the end of a line to continue a list on the next line.

banned = pthc*, *pthc, ptsc*, *ptsc, *hussyfan*, *r@ygold*, *raygold*, *babyshivid*, *kingpass*, \
    childlover*, jailbait*, lolicon*, shotacon*, \
    *kinderporn*, *kidporn*, *kiddieporn*, *kiddyporn*, *childporn*, *pedoporn*, \
    kid porn, kiddie porn, kiddy porn, child porn, \
    pedo, pedos, paedo, paedos, pedobear, pedophil*, paedophil*, pedofil*, pédophil*

minor = preteen*, pre teen, underage*, under age, child, childs, children, kid, kids, kiddie*, kiddy, \
    toddler*, infant*, enfant, enfants, fillette*, gamine, gamines, kinder

sexual = *fuck*, *porn*, xxx*, *blowjob*, *cumshot*, masturb*, *orgasm*, *pussy*, molest*, incest*, \
    sex, sexe, sexual, nude, nudes, naked, nudist*, naturist*, stripped, stripping, striptease, \
    anal, cock, rape, raped, baise*, viol, violée, violé

ageSuffixes = yo, y o, yr, yrs, yr old, yrs old, year old, years old, ans, jahre

maxMinorAge = 17

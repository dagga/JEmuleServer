# A published file whose name matches is never indexed and its hash is banned for good (table banned_hashes).
# Files already in the database are checked at every startup: matching files are deleted and banned.
# This filter cannot be disabled. To use your own list, copy this file and set childAbuseKeywordsPath in
# server.properties; an unreadable file falls back to this embedded list.
#

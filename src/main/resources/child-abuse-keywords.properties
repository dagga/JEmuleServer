#     "9 ans", "11y"), together with a "sexual" term.
#
# The "banned" list includes series and studio markers found in the names of the files purged from a production
# server. Terms that are also common first names or words ("lolita", "nina", "brosis") are deliberately left out:
# they flagged adult content. "periscope" (a live video app) is banned at the operator's request: it names the
# source of a large share of the purged files, at the cost of refusing legitimate Periscope recordings too.
# It also includes the studio, site and series names of a third-party CSAM filtering list. Names from that list that
# are also ordinary phrases ("little beauties", "silver dreams", "star sessions") are "minor" terms instead: they only
# match together with a sexual term. Plain words of that list ("daughter", "angelina", "polygon", "magic kingdom")
# and adult studios ("color climax") are left out.
#
# Syntax: comma-separated terms, case-insensitive. Names are split into words on every character other than a
# letter, a digit or '@'. A term matches whole words only ("kid" matches "Kid.avi" but not "kidnap").
# '*' stands for any letters or digits ("pedophil*" matches "pedophile" and "pedophilia", "*porn*" matches
# "kidporn"). A term with a space matches consecutive words ("child porn" matches "Child.Porn" and "child_porn").
# Use a backslash at the end of a line to continue a list on the next line.


# JEmuleServer - reference production server: 6 vCPU, 11.4 GB of RAM, no swap, sized for 10,000,000 files
# (see README, Memory sizing)
# Launch:
#   java --add-modules=jdk.httpserver -Xmx6g -XX:+UseCompactObjectHeaders -XX:ThreadPriorityPolicy=1 \
#        -jar JEmuleServer-<version>.jar server-reference.properties
# With several CPUs the JVM uses the G1 collector: the options of the minimal server (-Xmn48m, the heap free ratios,
# MarkSweepDeadRatio) are for the serial collector and are not needed here.
# Only the values that differ from server.properties are commented; see server.properties for every option.
port=4661
maxPacketSize=2097152
maxSearchResults=600
# A search played on Kad or on the other eD2K servers within these minutes is not played again: its results are
# reused (default: 15, 0 = every search is played)
remoteSearchCacheMinutes=15
# Seconds before a write of the file index reaches the searches; each refresh rewrites the source counts of the index
# segments holding changed files (default: 10)
indexRefreshSeconds=10
floodMaxRequestsPerSecond=50
maxUsers=1000000

# 10,000,000 files: about 2.7 GB of live heap (270 bytes per file) plus 1/8 of slack for the growth of the index
# arrays, below the 4.9 GB the heap guard allows with -Xmx6g
maxFiles=10000000
maxFilesPerUser=50000
maxSourcesPerFile=400

databasePath=./jemule_db
ipFilterPath=./ipfilter.dat
fakeFileDetectionEnabled=true

adminWebPort=8080
adminBindAddress=0.0.0.0
# Loopback; add the administrator's address
adminAllowedIps=127.0.0.1,::1

cbFailureRateThreshold=50.0
cbMinimumNumberOfCalls=10
cbWaitDurationInSeconds=60
tcpKeepAliveTimeoutInSeconds=1800
heartbeatIntervalSeconds=120
lowIdCheckTimeoutSeconds=5

# The other production servers, searched and kept as verified peers
# serverPeers=server.example.net:4661
serverMetUrl=https://upd.emule-security.org/server.met

kadEnabled=true
kadBootstrapFromClients=true
kadMaxRoutingContacts=500
kadForkSearchEnabled=true
kadSearchTimeoutSeconds=4
kadAutoIngestToH2=true
kadMinSourcesForIngest=1
kadNodesUrls=https://upd.emule-security.org/nodes.dat,http://www.alldivx.de/nodes/nodes.dat

offerFilesV1Enabled=true
kadSourceSearchEnabled=true

serverIndexUpdateEnabled=true
serverIndexUpdateMinSources=1
serverIndexUpdateMaxPerDay=2000
serverIndexUpdateMaxPerHour=120

# Relay mode (README "Relay server"): on a relay, the server whose index is used and fed with the files found
# relayServer=main.example.net:4661
# relayFeedPort=8080
# On the server whose index is used: the relays allowed to post their files
# relayClients=relay.example.net
# On both: the shared secret, at least 16 characters (or the JEMULE_RELAY_TOKEN environment variable)
# relayToken=

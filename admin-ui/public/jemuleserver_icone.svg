<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64" role="img" aria-label="JEmuleServer">
  <defs>
    <linearGradient id="poil" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#c97a3a"/><stop offset="1" stop-color="#9c5524"/></linearGradient>
    <linearGradient id="museau" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#eef0f1"/><stop offset="1" stop-color="#b9bec2"/></linearGradient>
    <radialGradient id="bulle" cx=".35" cy=".3" r=".8"><stop offset="0" stop-color="#6fb6ff"/><stop offset=".55" stop-color="#2a78d6"/><stop offset="1" stop-color="#174f9e"/></radialGradient>
  </defs>
  <!-- oreilles : la gauche dressée, la droite qui penche -->
  <g stroke="#5e3112" stroke-width="1.4">
    <ellipse cx="20" cy="13" rx="5.6" ry="12.5" transform="rotate(-18 20 13)" fill="url(#poil)"/>
    <ellipse cx="45" cy="14" rx="5.6" ry="12.5" transform="rotate(34 45 14)" fill="url(#poil)"/>
  </g>
  <ellipse cx="20" cy="14" rx="2.4" ry="8.5" transform="rotate(-18 20 14)" fill="#e7a978"/>
  <ellipse cx="44.6" cy="14.8" rx="2.4" ry="8.5" transform="rotate(34 44.6 14.8)" fill="#e7a978"/>
  <!-- tête -->
  <path d="M17 33c0-9.5 6.7-15 15-15s15 5.5 15 15c0 3-0.6 5.6-1.6 7.8H18.6C17.6 38.6 17 36 17 33z" fill="url(#poil)" stroke="#5e3112" stroke-width="1.4"/>
  <!-- toupet -->
  <path d="M28 20.5c1-3.8 2.6-5.6 4.4-6.2-.6 1.4-.5 2.6.3 3.4.9-1.6 2.3-2.4 4-2.4-1 1.2-1.5 2.6-1.3 4.6" fill="#7a3f17" stroke="#5e3112" stroke-width="1" stroke-linejoin="round"/>
  <!-- yeux mi-clos -->
  <g stroke="#3a1d08" stroke-width="1.1">
    <circle cx="26" cy="30" r="4.3" fill="#fff"/>
    <circle cx="38" cy="30" r="4.3" fill="#fff"/>
  </g>
  <circle cx="26.8" cy="31.4" r="1.9" fill="#1d1d1d"/>
  <circle cx="37.2" cy="31.4" r="1.9" fill="#1d1d1d"/>
  <path d="M21.7 29.8a4.3 4.3 0 0 1 8.6 0z" fill="#a85d28" stroke="#3a1d08" stroke-width="1.1" stroke-linejoin="round"/>
  <path d="M33.7 29.8a4.3 4.3 0 0 1 8.6 0z" fill="#a85d28" stroke="#3a1d08" stroke-width="1.1" stroke-linejoin="round"/>
  <!-- museau -->
  <ellipse cx="32" cy="44" rx="13.5" ry="10" fill="url(#museau)" stroke="#6d7378" stroke-width="1.4"/>
  <ellipse cx="26.5" cy="42" rx="2.1" ry="2.8" transform="rotate(-12 26.5 42)" fill="#4a4f53"/>
  <ellipse cx="37.5" cy="42" rx="2.1" ry="2.8" transform="rotate(12 37.5 42)" fill="#4a4f53"/>
  <path d="M24 49c5 2.6 11 2.6 16-.4" fill="none" stroke="#4a4f53" stroke-width="1.4" stroke-linecap="round"/>
  <!-- la langue tirée -->
  <path d="M33.5 50.2c-.4 4.4 1.3 7.4 4 7.3 2.8-.1 3.6-3.6 2.4-8.4z" fill="#ec5b78" stroke="#a3263f" stroke-width="1.2" stroke-linejoin="round"/>
  <path d="M36.6 51.5v3.2" stroke="#a3263f" stroke-width="1" stroke-linecap="round"/>
  <!-- le serveur : la bulle bleue et ses satellites, comme le « e » d'eMule -->
  <g stroke="#174f9e" stroke-width="1.6" stroke-linecap="round">
    <path d="M53 50.5L60 44.5M53 50.5L61 56M53 50.5L45.5 59"/>
  </g>
  <circle cx="60.2" cy="44.2" r="2.6" fill="url(#bulle)" stroke="#fff" stroke-width="1"/>
  <circle cx="61" cy="56.2" r="2.3" fill="url(#bulle)" stroke="#fff" stroke-width="1"/>
  <circle cx="45.3" cy="59.3" r="2.3" fill="url(#bulle)" stroke="#fff" stroke-width="1"/>
  <circle cx="53" cy="50.5" r="5.6" fill="url(#bulle)" stroke="#fff" stroke-width="1.4"/>
  <ellipse cx="51.4" cy="48.6" rx="2.2" ry="1.3" transform="rotate(-30 51.4 48.6)" fill="#fff" opacity=".7"/>
</svg>
